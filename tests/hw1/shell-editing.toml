image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 2000000

[[inputs]]
at_tick = 300000
uart = 0
data = "\b\u007fecho abz\b\u007fcd\n\n   \necho\n   echo   hello  you\nmystery arg\n"

[assert]
uart0_contains = "msh> acd\nmsh> msh> msh> \nmsh> hello  you\nmsh> command not found: mystery\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
