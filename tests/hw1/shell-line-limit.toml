image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 2000000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo 123456789012345\necho 1234567890123456\b\necho recovered\n"

[assert]
uart0_contains = "msh> 123456789012345\nmsh> line too long\nmsh> recovered\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
